name: Publish simulator

# Puts the simulator page that CI built and checked on master onto the public
# site, https://cozycactus.github.io/rebirth/ (repository
# cozycactus/cozycactus.github.io, branch main, folder rebirth/).
#
# workflow_run reads this file from the default branch only, so the publishing
# logic is always master's, whatever a branch carries. It runs after CI
# completes on a push to master and publishes only when CI succeeded; a red
# check leaves the last good page in place. Nothing here builds or runs code
# from the downloaded package: sim/publish.sh comes from this checkout.
#
# Needs: the secret SITE_DEPLOY_KEY (the private half of a deploy key with
# write access on the site repository) and the variable SIM_PUBLISH set to
# "on". Run it by hand (workflow_dispatch) to publish master's tip again.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One publisher at a time, and none cancelled halfway through a push.
concurrency:
  group: publish-simulator
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the simulator page
    if: >-
      vars.SIM_PUBLISH == 'on' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0

      # Only master's tip is published. A run for an older commit stands down:
      # the newer commit's own CI run will publish it.
      - name: Find the CI run of master's tip
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git rev-parse HEAD)
          if [ "$EVENT" = workflow_run ]; then
            if [ "$RUN_SHA" != "$tip" ]; then
              echo "CI ran for $RUN_SHA, but master is at $tip now: its own run will publish it."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run=$RUN_ID
          else
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch master --event push --status success \
              --limit 30 --json databaseId,headSha --jq "map(select(.headSha == \"$tip\"))[0].databaseId // empty")
            [ -n "$run" ] || { echo "No successful CI run on a push of master's tip $tip." >&2; exit 1; }
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download the page CI built
        if: steps.run.outputs.skip == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: simulator-site
          path: ${{ runner.temp }}/simulator-site
          run-id: ${{ steps.run.outputs.run }}
          github-token: ${{ github.token }}

      - name: Check the package is master's tip
        if: steps.run.outputs.skip == 'false'
        env:
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          grep -q "\"commit\":\"$SHA\"" "$RUNNER_TEMP/simulator-site/page/version.js"
          grep -q "^- Built from commit $SHA " "$RUNNER_TEMP/simulator-site/source/README.md"

      - name: Publish to the site
        if: steps.run.outputs.skip == 'false'
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          [ -n "$SITE_DEPLOY_KEY" ] || { echo "The secret SITE_DEPLOY_KEY is not set." >&2; exit 1; }
          umask 077
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$SITE_DEPLOY_KEY" > "$ssh_dir/key"
          # GitHub's published host keys, so the host is checked, not trusted on first use.
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          site="$RUNNER_TEMP/site"
          git clone --quiet git@github.com:cozycactus/cozycactus.github.io.git "$site"
          short=${SHA:0:7}
          subject=$(git log -1 --format=%s "$SHA")
          for attempt in 1 2 3; do
            # A page from a newer master already there is never replaced by an older one.
            published=$(sed -nE 's/.*"commit":"([0-9a-f]{40})".*/\1/p' "$site/rebirth/version.js" 2>/dev/null || true)
            if [ -n "$published" ] && [ "$published" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$published" 2>/dev/null; then
              echo "The site already runs $published, newer than $SHA."
              exit 0
            fi
            sim/publish.sh apply "$RUNNER_TEMP/simulator-site" "$site"
            if git -C "$site" diff --cached --quiet; then
              echo "The site already runs $SHA."
              exit 0
            fi
            git -C "$site" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Publish the simulator at $short" -m "$subject" -m "From cozycactus/rebirth $SHA, built and checked by its CI."
            if git -C "$site" push --quiet origin HEAD:main; then
              echo "Published $SHA."
              exit 0
            fi
            echo "The site's main moved; laying the page over it again."
            git -C "$site" fetch --quiet origin main
            git -C "$site" reset --quiet --hard origin/main
          done
          echo "Could not push to the site after 3 attempts." >&2
          exit 1
